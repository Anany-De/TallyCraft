[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tallycraft"
version = "0.1.0"
description = "Clean-room accounting primitives for TallyCraft"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools]
packages = ["tallycraft"]
